<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University of Jos - Sign Up</title>
  <link rel="stylesheet" href="signup.css" />
</head>

<body>
  <header class="top-banner">
    <a href="webpageunijos.html">
      <div class="brand">
        <div class="logo"><img src="uj logo.png" alt="uj logo"></div>
        <h1>University of Jos</h1>
      </div>
    </a>
  </header>

  <section class="page">
    <div class="cards">
      <div class="instructions">
        <h2>Instruction(s)</h2>
        <p>Please type in Email Address.</p>
        <a class="login-link" href="Login Portal.html">Back to Login Page</a>
      </div>

      <form class="form-area" action="#" method="post">
        <label for="email">Email*</label>
        <input id="email" name="email" type="email" placeholder="Enter Email here" required />
        <button type="submit">Get Started</button>
      </form>
    </div>
  </section>


  <footer class="footer">
    <p>Copyright &copy;2026 <strong>University Of Jos.</strong> All Rights Reserved</p>
    <nav class="footer-nav" aria-label="Footer">
      <a href="#">FAQ</a>
      <span>|</span>
      <a href="#">Support</a>
    </nav>
  </footer>

  <div class="help-text">We Are Here!</div>
  <div class="help-widget" aria-label="Help">?</div>
</body>

</html>
